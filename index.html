<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Squad Queue</title>
<style>
:root{--bg:#f4f5f8;--card:#fff;--text:#1a1d29;--mut:#6b7185;--line:#dfe2ea;--acc:#2f6bff}
@media (prefers-color-scheme:dark){:root{--bg:#12151d;--card:#1b1f2b;--text:#e8eaf2;--mut:#8b92a8;--line:#2b3144;--acc:#5b8cff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:900px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:26px;margin:0 0 2px}
.sub{color:var(--mut);margin:0 0 16px}
.bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
button,input{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
button.act{background:var(--text);color:var(--bg);border-color:var(--text)}
input{cursor:text;flex:1;min-width:160px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-top:12px}
.g{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.g img{width:100%;display:block;aspect-ratio:460/215;object-fit:cover;background:var(--line)}
.b{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1}
.n{font-weight:700}
.n a{color:inherit;text-decoration:none}
.n a:hover{color:var(--acc)}
.m{color:var(--mut);font-size:13px}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:auto}
.t{font-size:12px;border:1px solid var(--line);border-radius:99px;padding:1px 8px}
.t.mode{border-color:var(--acc);color:var(--acc)}
.msg{text-align:center;color:var(--mut);padding:36px 0}
</style>
</head>
<body>
<main>
  <h1>🎮 Squad Queue</h1>
  <p class="sub">Discover multiplayer games on Steam to play with your friends.</p>
  <div class="bar" id="lists"></div>
  <div class="bar" id="modes"></div>
  <div class="bar"><input id="q" placeholder="Search these results"></div>
  <div id="out" class="msg">Loading…</div>
</main>
<script>
const LISTS=[["coming_soon","Coming soon"],["new_releases","New releases"],["top_sellers","Top sellers"]];
const MODES=[["all","Any multiplayer"],["Co-op","Co-op"],["PvP","PvP"],["MMO","MMO"]];
let list="coming_soon",mode="all",games=[];
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function bars(){
  $("lists").innerHTML=LISTS.map(([k,l])=>`<button data-l="${k}" class="${list===k?"act":""}">${l}</button>`).join("");
  $("modes").innerHTML=MODES.map(([k,l])=>`<button data-m="${k}" class="${mode===k?"act":""}">${l}</button>`).join("");
}
function draw(){
  const q=$("q").value.trim().toLowerCase();
  const gs=games.filter(g=>(mode==="all"||g.modes.includes(mode))&&g.name.toLowerCase().includes(q));
  $("out").className=gs.length?"grid":"msg";
  $("out").innerHTML=gs.length?gs.map(g=>`<div class="g"><img src="${esc(g.image)}" alt="" loading="lazy"><div class="b">
    <div class="n"><a href="https://store.steampowered.com/app/${g.id}" target="_blank" rel="noopener">${esc(g.name)}</a></div>
    <div class="m">${g.comingSoon?"Releases ":"Released "}${esc(g.release||"TBA")} · ${esc(g.price)}</div>
    <div class="tags">${g.modes.map(m=>`<span class="t mode">${esc(m)}</span>`).join("")}${g.genres.map(x=>`<span class="t">${esc(x)}</span>`).join("")}</div></div></div>`).join(""):"No multiplayer games match.";
}
async function load(){
  $("out").className="msg";$("out").textContent="Loading…";
  try{const r=await fetch("/api/games?list="+list);const j=await r.json();games=j.games||[];if(j.error)throw 0;draw()}
  catch(e){$("out").textContent="Couldn't reach Steam right now. Try again in a minute."}
}
document.addEventListener("click",e=>{
  const d=e.target.dataset;
  if(d.l){list=d.l;bars();load()}
  else if(d.m){mode=d.m;bars();draw()}
});
$("q").oninput=draw;
bars();load();
</script>
</body>
</html>
